{% set name = "ai4ts" %}
{% set version = "0.1" %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 7232953db9b56c7c7f30bf60f55bdd1f517f167f4c73f0bb714b5ebca1838615

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - requests
    - numpy

test:
  requires:
    - python {{ python_min }}
  imports:
    - ai4ts

about:
  home: https://github.com/WenjieDu/AI4TS
  summary: |
    The client for Time-Series AI (https://time-series.ai), 
    where we build artificial intelligence for unified time-series analysis
  description: |
    The client for Time-Series AI (https://time-series.ai), 
    where we build artificial intelligence for unified time-series analysis.
  license: Apache-2.0
  license_file: LICENSE
  doc_url: https://docs.pypots.com
  dev_url: https://github.com/WenjieDu/AI4TS

extra:
  recipe-maintainers:
    - WenjieDu
